  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
    line-height: 1.5;
  }
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1F4E78 0%, #2E7D32 100%);
    padding: 20px;
  }
  .login-card {
    background: #fff;
    padding: 40px 32px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    width: 100%;
    max-width: 400px;
  }
  .login-card h1 { font-size: 22px; color: #1F4E78; margin-bottom: 6px; text-align: center; }
  .login-card .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
  .form-group input, .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d0d5da;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  .form-group input:focus {
    outline: none;
    border-color: #1F4E78;
    box-shadow: 0 0 0 3px rgba(31,78,120,0.12);
  }
  .btn {
    padding: 10px 18px; border: none; border-radius: 6px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; font-family: inherit;
  }
  .btn-primary { background: #1F4E78; color: #fff; width: 100%; padding: 12px; }
  .btn-primary:hover { background: #17395a; }
  .btn-secondary { background: #fff; color: #1F4E78; border: 1px solid #1F4E78; }
  .btn-secondary:hover { background: #f0f4f8; }
  .btn-success { background: #2E7D32; color: #fff; }
  .btn-success:hover { background: #256428; }
  .btn-apply {
    background: #C65911; color: #fff; padding: 4px 10px;
    font-size: 12px; border-radius: 4px; border: none;
    cursor: pointer; font-weight: 600;
  }
  .btn-apply:hover { background: #a34910; }
  .error-msg { color: #c62828; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }

  #main-screen { display: none; }
  .topbar {
    background: #1F4E78; color: #fff;
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .topbar h2 { font-size: 18px; }
  .topbar .village-code { opacity: 0.8; font-size: 13px; margin-left: 8px; }
  .topbar .user-info { display: flex; align-items: center; gap: 14px; font-size: 14px; }
  .topbar .user-info a { color: #fff; text-decoration: underline; cursor: pointer; }

  .stats-bar {
    background: #fff; padding: 14px 24px;
    border-bottom: 1px solid #e0e4e8;
    display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  }
  .stat-item { font-size: 13px; }
  .stat-item .label { color: #666; }
  .stat-item .value { font-weight: 700; color: #1F4E78; font-size: 15px; }
  .progress-wrap { flex: 1; min-width: 200px; max-width: 400px; }
  .progress-bar { height: 10px; background: #e0e4e8; border-radius: 5px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #2E7D32, #66BB6A); transition: width 0.3s; }
  .progress-text { font-size: 12px; color: #666; margin-top: 4px; }

  .toolbar {
    background: #fff; padding: 14px 24px;
    border-bottom: 1px solid #e0e4e8;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .toolbar input[type="text"] {
    flex: 1; min-width: 240px;
    padding: 9px 12px;
    border: 1px solid #d0d5da; border-radius: 6px; font-size: 14px;
  }
  .toolbar select {
    padding: 9px 12px;
    border: 1px solid #d0d5da; border-radius: 6px; font-size: 14px; background: #fff;
  }
  .match-filter-banner {
    background: #fff8ea; border: 1px solid #f0d878;
    padding: 10px 16px;
    margin: 12px 24px 0 24px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; font-size: 13px;
  }
  .match-filter-banner.hidden { display: none; }

  .table-wrap { padding: 20px 24px; overflow-x: auto; }
  table {
    width: 100%; background: #fff; border-collapse: collapse;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    border-radius: 8px; overflow: hidden; font-size: 13px;
  }
  thead th {
    background: #1F4E78; color: #fff;
    padding: 12px 10px; text-align: left;
    font-weight: 600; white-space: nowrap;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px;
  }
  tbody tr {
    border-bottom: 1px solid #eef0f2;
    cursor: pointer; transition: background 0.1s;
  }
  tbody tr:hover { background: #f8fafc; }
  tbody tr.expanded { background: #fff8ea; border-left: 4px solid #C65911; }
  tbody tr.match { background: #fff3e0; border-left: 4px solid #f0d878; }
  tbody tr.match:hover { background: #ffe9c8; }
  tbody td { padding: 10px; vertical-align: top; }
  .sr-cell { font-weight: 700; color: #2E7D32; text-align: center; }
  .status-badge {
    display: inline-block; padding: 3px 10px;
    border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .status-pending { background: #fff3e0; color: #C65911; }
  .status-filled  { background: #e8f5e9; color: #2E7D32; }
  .match-badge {
    display: inline-block; padding: 2px 8px;
    background: #ffe082; color: #6d4c00;
    border-radius: 10px; font-size: 10px;
    font-weight: 700; margin-left: 6px; text-transform: uppercase;
  }

  .expand-row td {
    padding: 0; background: #fffbef;
    border-bottom: 2px solid #f0d878;
  }
  .expand-content {
    padding: 20px 24px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }
  .expand-content h4 {
    grid-column: 1 / -1; color: #1F4E78; margin-bottom: 4px;
    font-size: 14px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .expand-content .actions {
    grid-column: 1 / -1;
    display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap;
  }
  .row-meta {
    grid-column: 1 / -1;
    background: #f4f6f8; padding: 10px 14px;
    border-radius: 6px; font-size: 12px; color: #555;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px 20px;
  }
  .row-meta span strong { color: #222; }

  .pagination {
    padding: 16px 24px;
    display: flex; justify-content: center; align-items: center;
    gap: 6px; flex-wrap: wrap;
  }
  .pagination button {
    padding: 6px 12px; border: 1px solid #d0d5da;
    background: #fff; border-radius: 4px;
    cursor: pointer; font-size: 13px;
  }
  .pagination button:hover:not(:disabled) { background: #f0f4f8; }
  .pagination button.active { background: #1F4E78; color: #fff; border-color: #1F4E78; }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 20px; background: #2E7D32; color: #fff;
    border-radius: 6px; font-size: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    z-index: 200; opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.25s, transform 0.25s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: #c62828; }

  @media (max-width: 640px) {
    .topbar { padding: 12px 16px; }
    .toolbar, .table-wrap, .stats-bar { padding: 12px 16px; }
    thead th, tbody td { padding: 8px 6px; font-size: 12px; }
    .hide-mobile { display: none; }
  }
</style>
</head>

</div>

anal 8 Marla 0.0000 Sqft","land_usage":"Agricultural","acquisition":"Others","ownership_type":"Joint","land_holder_type":"CULTIVATOR"},{"sr_no":1867,"sheet_row":1868,"khewat":"54","khata":"76.","khasra":"218","owner_name":"ALI","identifier_name":"AKBAR","identifier_type":"S/o","extent_kanal":"0.7","extent_marla":"14","total_plot_area":"1 Kanal 8 Marla 0.0000 Sqft","land_usage":"Agricultural","acquisition":"Others","ownership_type":"Joint","land_holder_type":"CULTIVATOR"}];
const filled = {};

let currentUser = null;
let sessionToken = null;
let userRole = null;
let currentPage = 1;
let filteredRecords = [...RECORDS];
let expandedSrNo = null;
let originSrNo = null;           // the row that started the current walkthrough
let matchSrNos = new Set();
let matchFilterActive = false;

async function handleLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  const btn = document.querySelector('#login-screen .btn-primary');
  if (!u || !p) { err.textContent = "Enter username and password."; return; }
  if (APPS_SCRIPT_URL.indexOf('PASTE_YOUR_APPS_SCRIPT_URL_HERE') === 0) {
    err.textContent = "Backend URL not configured. Contact administrator.";
    return;
  }

  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const res = await apiCall({
      action: 'login',
      username: u,
      password: p,
      village_code: VILLAGE_CODE
    });
    if (!res.ok) {
      err.textContent = res.error || 'Login failed.';
      return;
    }
    currentUser  = res.user.username;
    sessionToken = res.token;
    userRole     = res.user.role;

    document.getElementById('current-user').textContent = currentUser + ' (' + userRole + ')';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display  = 'block';

    // Load which rows are already filled
    await fetchInitialStatus();
    renderAll();
  } catch (e) {
    err.textContent = 'Network error — check your connection and try again.';
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

async function fetchInitialStatus() {
  try {
    const res = await apiCall({
      action: 'fetchStatus',
      token: sessionToken,
      village_code: VILLAGE_CODE
    });
    if (res.ok && res.filled) {
      // reset local cache and populate from server
      Object.keys(filled).forEach(k => delete filled[k]);
      Object.entries(res.filled).forEach(([sr, data]) => {
        filled[parseInt(sr, 10)] = data;
      });
    }
  } catch (e) {
    console.warn('fetchInitialStatus failed:', e);
    toast('Could not load existing entries — starting fresh view.', true);
  }
}

function handleLogout() {
  currentUser = null;
  sessionToken = null;
  userRole = null;
  expandedSrNo = null;
  originSrNo = null;
  matchSrNos.clear();
  matchFilterActive = false;
  Object.keys(filled).forEach(k => delete filled[k]);
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') {
    handleLogin();
  }
});

function renderAll() { applyFilters(); renderStats(); renderTable(); renderPagination(); }

function renderStats() {
  const total = RECORDS.length;
  const done = Object.keys(filled).length;
  const pending = total - done;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('total-count').textContent = total;
  document.getElementById('done-count').textContent = done;
  document.getElementById('pending-count').textContent = pending;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = pct + '% complete';
}

function applyFilters() {
  const q = document.getElementById('search-box').value.trim().toLowerCase();
  const statusFilter = document.getElementById('filter-status').value;

  filteredRecords = RECORDS.filter(r => {
    if (matchFilterActive) {
      if (!matchSrNos.has(r.sr_no) && r.sr_no !== expandedSrNo) return false;
    }
    if (q) {
      const hay = `${r.sr_no} ${r.khewat} ${r.khasra} ${r.khata} ${r.owner_name} ${r.identifier_name}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (statusFilter === 'pending' && filled[r.sr_no]) return false;
    if (statusFilter === 'filled'  && !filled[r.sr_no]) return false;
    return true;
  });
  currentPage = 1;
}

function renderTable() {
  const pageSize = parseInt(document.getElementById('page-size').value, 10);
  const start = (currentPage - 1) * pageSize;
  const pageRecords = filteredRecords.slice(start, start + pageSize);
  const tbody = document.getElementById('records-tbody');
  tbody.innerHTML = '';

  if (pageRecords.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:#888;">
      No records match your filters.</td></tr>`;
    return;
  }

  pageRecords.forEach(r => {
    const isFilled = !!filled[r.sr_no];
    const isExpanded = r.sr_no === expandedSrNo;
    const isMatch = matchSrNos.has(r.sr_no);

    const tr = document.createElement('tr');
    if (isExpanded) tr.classList.add('expanded');
    else if (isMatch) tr.classList.add('match');

    tr.onclick = (e) => {
      if (e.target.closest('.btn-apply')) return;
      toggleExpand(r.sr_no);
    };

    const identifier = r.identifier_name
      ? `${r.identifier_type ? '(' + escapeHtml(r.identifier_type) + ') ' : ''}${escapeHtml(r.identifier_name)}`
      : '—';

    let actionCell = '';
    if (isMatch && expandedSrNo !== null) {
      actionCell = `<button class="btn-apply" onclick="applyToRow(${r.sr_no})" title="Copy the open row's Aadhaar details to Sr. No. ${r.sr_no}">Apply →</button>`;
    }

    tr.innerHTML = `
      <td class="sr-cell">${r.sr_no}</td>
      <td>${escapeHtml(String(r.khewat))}</td>
      <td><strong>${escapeHtml(r.khasra)}</strong></td>
      <td>${escapeHtml(r.owner_name)}</td>
      <td>${identifier}</td>
      <td class="hide-mobile">${escapeHtml(r.acquisition || '—')}</td>
      <td>
        <span class="status-badge ${isFilled ? 'status-filled' : 'status-pending'}">
          ${isFilled ? '✓ Filled' : 'Pending'}
        </span>
      </td>
      <td>${actionCell}</td>
    `;
    tbody.appendChild(tr);

    if (isExpanded) {
      const expTr = document.createElement('tr');
      expTr.className = 'expand-row';
      expTr.id = 'exp-' + r.sr_no;
      expTr.innerHTML = buildExpandContent(r);
      tbody.appendChild(expTr);
    }
  });
}

function buildExpandContent(r) {
  // Try to pre-fill from any already-saved row in this walkthrough (same person)
  let existing = filled[r.sr_no];
  let prefillNote = '';
  if (!existing && originSrNo !== null) {
    const walkthrough = [originSrNo, ...Array.from(matchSrNos)];
    for (const sr of walkthrough) {
      if (sr !== r.sr_no && filled[sr]) {
        const src = filled[sr];
        existing = {
          aadhaar_name: src.aadhaar_name, aadhaar_no: src.aadhaar_no,
          parentage: src.parentage, residence: src.residence, mobile: src.mobile
        };
        prefillNote = `<span class="match-badge" style="background:#e8f5e9; color:#2E7D32;">Pre-filled from Sr. No. ${sr} — verify &amp; save</span>`;
        break;
      }
    }
  }
  existing = existing || {};

  const matchCount = matchSrNos.size;
  const walkthrough = [originSrNo, ...Array.from(matchSrNos)].sort((a,b) => a - b);
  const position = walkthrough.indexOf(r.sr_no) + 1;
  const totalInWalk = walkthrough.length;

  const matchBadge = matchCount > 0
    ? `<span class="match-badge">${matchCount} matching row${matchCount === 1 ? '' : 's'} highlighted</span>`
    : '<span class="match-badge" style="background:#e0e4e8; color:#666;">No other matches</span>';
  const positionBadge = matchCount > 0
    ? `<span class="match-badge" style="background:#1F4E78; color:#fff;">Row ${position} of ${totalInWalk} for this person</span>`
    : '';
  const showAllBtn = matchCount > 0 && !matchFilterActive
    ? `<button class="btn btn-secondary" style="font-size:12px; padding:4px 10px;" onclick="event.stopPropagation(); showOnlyMatches()">Show only this person's rows</button>`
    : '';
  const nextBtn = matchCount > 0
    ? `<button class="btn btn-primary" style="width:auto; padding:10px 18px;" onclick="event.stopPropagation(); nextMatch()">Next match →</button>`
    : '';

  return `
    <td colspan="8">
      <div class="expand-content">
        <h4>
          Aadhaar details for ${escapeHtml(r.owner_name)}
          (Sr. No. ${r.sr_no})
          ${matchBadge}
          ${positionBadge}
          ${prefillNote}
          ${showAllBtn}
        </h4>
        <div class="row-meta">
          <span><strong>Khewat:</strong> ${r.khewat}</span>
          <span><strong>Khata:</strong> ${r.khata}</span>
          <span><strong>Khasra:</strong> ${escapeHtml(r.khasra)}</span>
          <span><strong>Ownership:</strong> ${escapeHtml(r.ownership_type)}</span>
          <span><strong>Holder Type:</strong> ${escapeHtml(r.land_holder_type)}</span>
          <span><strong>Acquisition:</strong> ${escapeHtml(r.acquisition)}</span>
          <span><strong>Plot Area:</strong> ${escapeHtml(r.total_plot_area)}</span>
        </div>
        <div class="form-group">
          <label>Name (as per Aadhaar) *</label>
          <input type="text" id="fld-name-${r.sr_no}" value="${escapeHtml(existing.aadhaar_name || '')}">
        </div>
        <div class="form-group">
          <label>Aadhaar No. *</label>
          <input type="text" id="fld-aadhaar-${r.sr_no}" value="${escapeHtml(existing.aadhaar_no || '')}"
            pattern="[0-9]{12}" maxlength="12" placeholder="12 digits">
        </div>
        <div class="form-group">
          <label>Parentage (as per Aadhaar) *</label>
          <input type="text" id="fld-parent-${r.sr_no}" value="${escapeHtml(existing.parentage || '')}">
        </div>
        <div class="form-group">
          <label>Residence (as per Aadhaar) *</label>
          <input type="text" id="fld-res-${r.sr_no}" value="${escapeHtml(existing.residence || '')}">
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="fld-mob-${r.sr_no}" value="${escapeHtml(existing.mobile || '')}"
            pattern="[0-9]{10}" maxlength="10" placeholder="10 digits (optional)">
        </div>
        <div class="actions">
          <button class="btn btn-success" onclick="event.stopPropagation(); saveRow(${r.sr_no})">Save this row</button>
          ${nextBtn}
          <button class="btn btn-secondary" onclick="event.stopPropagation(); toggleExpand(${r.sr_no})">Close</button>
        </div>
      </div>
    </td>`;
}

function toggleExpand(srNo) {
  if (expandedSrNo === srNo) {
    expandedSrNo = null;
    originSrNo = null;
    matchSrNos.clear();
    if (matchFilterActive) { matchFilterActive = false; hideMatchBanner(); }
    renderAll();
    return;
  }
  const inWalkthrough = srNo === originSrNo || matchSrNos.has(srNo);
  if (!inWalkthrough) {
    // Start a new walkthrough — this row becomes the origin
    originSrNo = srNo;
    const rec = RECORDS.find(r => r.sr_no === srNo);
    matchSrNos = new Set(
      RECORDS
        .filter(r =>
          r.sr_no !== srNo &&
          norm(r.owner_name) === norm(rec.owner_name) &&
          norm(r.identifier_name) === norm(rec.identifier_name)
        )
        .map(r => r.sr_no)
    );
  }
  expandedSrNo = srNo;
  renderAll();
  scrollToExpanded();
}

function nextMatch() {
  if (originSrNo === null) return;
  const walkthrough = [originSrNo, ...Array.from(matchSrNos)].sort((a,b) => a - b);
  const currentIdx = walkthrough.indexOf(expandedSrNo);
  if (currentIdx === -1) return;
  const nextIdx = (currentIdx + 1) % walkthrough.length;
  expandedSrNo = walkthrough[nextIdx];

  applyFilters();
  // Ensure the target row's page is shown
  const pageSize = parseInt(document.getElementById('page-size').value, 10);
  const targetIdxInFiltered = filteredRecords.findIndex(r => r.sr_no === expandedSrNo);
  if (targetIdxInFiltered >= 0) {
    currentPage = Math.floor(targetIdxInFiltered / pageSize) + 1;
  }
  renderStats();
  renderTable();
  renderPagination();
  scrollToExpanded();

  // Toast when wrapping back to origin
  if (nextIdx === 0) toast(`Back to origin — Sr. No. ${originSrNo}`);
}

function scrollToExpanded() {
  if (expandedSrNo === null) return;
  setTimeout(() => {
    const el = document.getElementById('exp-' + expandedSrNo);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function showOnlyMatches() {
  matchFilterActive = true;
  const rec = RECORDS.find(r => r.sr_no === expandedSrNo);
  const banner = document.getElementById('match-banner');
  const text = document.getElementById('match-banner-text');
  text.innerHTML = `Showing only <strong>${escapeHtml(rec.owner_name)}</strong>
    (${escapeHtml(rec.identifier_name)}) — ${matchSrNos.size + 1} rows in this village.`;
  banner.classList.remove('hidden');
  renderAll();
}

function clearMatchFilter() {
  matchFilterActive = false;
  hideMatchBanner();
  renderAll();
}

function hideMatchBanner() {
  document.getElementById('match-banner').classList.add('hidden');
}

function renderPagination() {
  const pageSize = parseInt(document.getElementById('page-size').value, 10);
  const totalPages = Math.max(1, Math.ceil(filteredRecords.length / pageSize));
  const container = document.getElementById('pagination');
  container.innerHTML = '';

  const mkBtn = (label, page, disabled, active) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.disabled = disabled;
    if (active) b.classList.add('active');
    b.onclick = () => { currentPage = page; renderTable(); renderPagination(); };
    return b;
  };

  container.appendChild(mkBtn('« First', 1, currentPage === 1));
  container.appendChild(mkBtn('‹ Prev', currentPage - 1, currentPage === 1));
  const win = 2;
  const from = Math.max(1, currentPage - win);
  const to   = Math.min(totalPages, currentPage + win);
  for (let p = from; p <= to; p++) {
    container.appendChild(mkBtn(String(p), p, false, p === currentPage));
  }
  container.appendChild(mkBtn('Next ›', currentPage + 1, currentPage === totalPages));
  container.appendChild(mkBtn('Last »', totalPages, currentPage === totalPages));

  const info = document.createElement('span');
  info.style.marginLeft = '14px';
  info.style.fontSize = '13px';
  info.style.color = '#666';
  info.textContent = `Page ${currentPage} of ${totalPages} · ${filteredRecords.length} record(s)`;
  container.appendChild(info);
}

function readFormFor(srNo) {
  return {
    aadhaar_name: (document.getElementById(`fld-name-${srNo}`)   || {}).value?.trim() || '',
    aadhaar_no:   (document.getElementById(`fld-aadhaar-${srNo}`)|| {}).value?.trim() || '',
    parentage:    (document.getElementById(`fld-parent-${srNo}`) || {}).value?.trim() || '',
    residence:    (document.getElementById(`fld-res-${srNo}`)    || {}).value?.trim() || '',
    mobile:       (document.getElementById(`fld-mob-${srNo}`)    || {}).value?.trim() || '',
  };
}

function validate(d) {
  if (!d.aadhaar_name) return "Name (as per Aadhaar) is required.";
  if (!d.aadhaar_no)   return "Aadhaar No. is required.";
  if (!/^\d{12}$/.test(d.aadhaar_no)) return "Aadhaar No. must be exactly 12 digits.";
  if (!d.parentage)    return "Parentage is required.";
  if (!d.residence)    return "Residence is required.";
  if (d.mobile && !/^\d{10}$/.test(d.mobile)) return "Mobile must be 10 digits.";
  return null;
}

function saveRow(srNo) {
  const data = readFormFor(srNo);
  const err = validate(data);
  if (err) { toast(err, true); return; }
  commitSave([srNo], data);
}

function applyToRow(targetSrNo) {
  if (expandedSrNo === null) { toast("Open a row first.", true); return; }
  const data = readFormFor(expandedSrNo);
  const err = validate(data);
  if (err) { toast("Fill the open row first — " + err, true); return; }
  commitSave([targetSrNo], data);
  toast(`Applied to Sr. No. ${targetSrNo}`);
}

async function commitSave(srNos, data) {
  const ts = new Date().toISOString();
  const payload = {
    action: 'save',
    token: sessionToken,
    village_code: VILLAGE_CODE,
    village_name: VILLAGE_NAME,
    entered_by: currentUser,
    entered_at: ts,
    rows: srNos.map(sr => {
      const rec = RECORDS.find(r => r.sr_no === sr);
      return { sr_no: sr, sheet_row: rec.sheet_row, ...data };
    })
  };

  // Optimistic local update — reverted if the server rejects
  const previous = {};
  srNos.forEach(sr => {
    previous[sr] = filled[sr];
    filled[sr] = { ...data, entered_by: currentUser, entered_at: ts };
  });
  renderStats();
  renderTable();

  try {
    const res = await apiCall(payload);
    if (!res.ok) {
      // Rollback
      srNos.forEach(sr => {
        if (previous[sr] === undefined) delete filled[sr];
        else filled[sr] = previous[sr];
      });
      renderStats();
      renderTable();
      toast('Save failed: ' + (res.error || 'unknown'), true);
      if (res.error && res.error.indexOf('authenticated') !== -1) {
        setTimeout(() => { toast('Session expired — please sign in again.', true); handleLogout(); }, 1500);
      }
      return;
    }
    if (srNos.length === 1 && srNos[0] === expandedSrNo) toast('Saved.');
  } catch (e) {
    // Rollback on network error
    srNos.forEach(sr => {
      if (previous[sr] === undefined) delete filled[sr];
      else filled[sr] = previous[sr];
    });
    renderStats();
    renderTable();
    toast('Network error — save not confirmed.', true);
    console.error(e);
  }
}

async function apiCall(payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    // text/plain avoids CORS preflight; Apps Script parses the JSON body regardless
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  });
  return await res.json();
}

function norm(s) {
  return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

document.getElementById('search-box').addEventListener('input', () => { applyFilters(); renderTable(); renderPagination(); });
document.getElementById('filter-status').addEventListener('change', () => { applyFilters(); renderTable(); renderPagination(); });
document.getElementById('page-size').addEventListener('change', () => { currentPage = 1; renderTable(); renderPagination(); });
</script>
